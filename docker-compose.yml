# Docker Compose for ARISA Cloud Backend — Development
# Usage: docker compose up -d

services:
  # ── PostgreSQL (for local dev only — production uses Supabase) ──
  postgres:
    image: postgres:15-alpine
    container_name: arisa-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: arisa
      POSTGRES_PASSWORD: arisa_dev_password
      POSTGRES_DB: arisa
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arisa']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: arisa-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
